<line x1="150" y1="124" x2="150" y2="470" stroke="#334155" stroke-dasharray="4 5"/>
<line x1="470" y1="124" x2="470" y2="470" stroke="#334155" stroke-dasharray="4 5"/>
<line x1="790" y1="124" x2="790" y2="470" stroke="#334155" stroke-dasharray="4 5"/>

<!-- 1 ULR in -->
<line x1="150" y1="150" x2="462" y2="150" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="306" y="139" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9fb3c8"><tspan font-weight="700" fill="#67e8f9">1</tspan> · ULR — app 16777251 (S6a) · IMSI 4520402… · :3868</text>

