<line x1="478" y1="308" x2="782" y2="308" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="630" y="297" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9fb3c8"><tspan font-weight="700" fill="#67e8f9">5</tspan> · ULR forwarded · hbhIn→hbhOut · :3869</text>

<!-- 6 ULA back -->
<line x1="782" y1="348" x2="478" y2="348" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="630" y="337" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9fb3c8"><tspan font-weight="700" fill="#67e8f9">6</tspan> · ULA — 2001 / 5421 / 5001</text>

<!-- 7 correlate chip -->
<rect x="356" y="368" width="228" height="48" rx="12" fill="rgba(6,182,212,0.10)" stroke="rgba(6,182,212,0.4)"/>
<text x="470" y="387" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dd3fc">correlate hbhOut→hbhIn · capture binding</text>
<text x="470" y="404" text-anchor="middle" font-size="9.5" fill="#8ea3bb">topology-hiding restore · deadline sweep 5s drives retry/failover</text>

<!-- 8 ULA out -->
<line x1="462" y1="442" x2="158" y2="442" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="306" y="431" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#9fb3c8"><tspan font-weight="700" fill="#67e8f9">8</tspan> · ULA answered on the original ingress link</text>

<!-- fail-closed accent -->
<line x1="470" y1="452" x2="470" y2="470" stroke="#f472b6" stroke-width="0" />
<rect x="236" y="478" width="468" height="26" rx="13" fill="rgba(244,114,182,0.08)" stroke="rgba(244,114,182,0.35)"/>
<text x="470" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#f9a8d4">no route / peer not ready ⇒ fail-closed DIAMETER_UNABLE_TO_DELIVER (3002) — never silent drop</text>
