<rect x="360" y="168" width="220" height="48" rx="12" fill="rgba(6,182,212,0.10)" stroke="rgba(6,182,212,0.4)"/>
<text x="470" y="187" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dd3fc">2–4 · screening · overload gate · loop-check</text>
<text x="470" y="204" text-anchor="middle" font-size="9.5" fill="#8ea3bb">violations ⇒ 3007 / 3004 TOO_BUSY / 3005 LOOP_DETECTED</text>

<rect x="356" y="240" width="228" height="48" rx="12" fill="rgba(6,182,212,0.10)" stroke="rgba(6,182,212,0.4)"/>
<text x="470" y="259" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dd3fc">rule engine — s6a-mvno-hss matched</text>
<text x="470" y="276" text-anchor="middle" font-size="9.5" fill="#8ea3bb">forward mvno-hss-pool · WEIGHTED_RR 70/30 · sticky IMSI TTL 24h</text>

