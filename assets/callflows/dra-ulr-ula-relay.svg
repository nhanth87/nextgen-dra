<text x="150" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">Seeder / MME</text>
<text x="150" y="104" text-anchor="middle" font-size="10.5" fill="#8ea3bb">SCTP|TCP diameter client</text>
<rect x="372" y="62" width="196" height="62" rx="10" fill="#16213a" stroke="#22d3ee" stroke-opacity="0.85"/>
<text x="470" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">Elisa Nextgen DRA</text>
<text x="470" y="104" text-anchor="middle" font-size="10.5" fill="#8ea3bb">micro-jainslee relay agent</text>
<rect x="692" y="62" width="196" height="62" rx="10" fill="#16213a" stroke="#06b6d4" stroke-opacity="0.5"/>
<text x="790" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f1f5f9">HSS simulator (hss-a)</text>
<text x="790" y="104" text-anchor="middle" font-size="10.5" fill="#8ea3bb">SCTP :3869 · S6a/SWx/Gx</text>

