# Database — bring your own. Defaults to a local H2 file for demo;
# export DRA_DB_KIND=postgresql + DRA_DB_URL/DRA_DB_USER/DRA_DB_PASSWORD for production.
quarkus.datasource.db-kind=${DRA_DB_KIND:h2}
quarkus.datasource.username=${DRA_DB_USER:sa}
quarkus.datasource.password=${DRA_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DRA_DB_URL:jdbc:h2:file:./data/dra;DB_CLOSE_DELAY=-1}

%prod.quarkus.flyway.migrate-at-start=true
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dratest;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

dra.bindings.ttl-default-seconds=86400
dra.bindings.sweep-every=60s
dra.bindings.sweep-every-seconds=60
dra.bindings.sweep-batch-size=1000
dra.bindings.writebehind.batch-size=200
dra.bindings.writebehind.interval-millis=500
dra.tx.timeout-millis=5000

dra.overload.global-rate-per-sec=50000
dra.overload.global-burst=5000
dra.overload.peer-rate-per-sec=5000
dra.overload.peer-burst=500
dra.th.pseudo-prefix=dra-edge
dra.th.pseudo-count=4
dra.th.full-edge=false
dra.relay.max-retries=3
dra.relay.sweep-period-millis=250
dra.screening.reject-unknown=true
